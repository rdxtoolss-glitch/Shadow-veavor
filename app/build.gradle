apply plugin: 'com.android.application'

// ---------------------------------------------------------------------------
// Shadow Weaver - app module
//
// Deliberately ZERO third-party dependencies. The game is SurfaceView +
// Canvas + AudioTrack, all of which are in the Android framework itself.
// No AdMob, no billing, no analytics, no external jars.
// ---------------------------------------------------------------------------

android {
    namespace 'com.mobodevs.shadowweaver'
    compileSdkVersion 35

    defaultConfig {
        applicationId "com.mobodevs.shadowweaver"
        minSdkVersion 21
        targetSdkVersion 35
        versionCode 2
        versionName "2.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
